[project]
name = "consilium" # pragma: allowlist secret
version = "0.1.0"
description = "Histopathology case retrieval API. Research prototype, not for clinical use."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
consilium = "consilium.cli:main" # pragma: allowlist secret

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consilium"] # pragma: allowlist secret

# Dependency groups: `uv sync` installs the API and dev tools only.
# `pipeline` is the GPU stack (torch, timm, transformers). Mahmood Lab TRIDENT
# is not on PyPI — the PyPI project "trident" is an unrelated astronomy package —
# so it is installed from GitHub on the GPU machine, not locked here.
# `tiles` is OpenSlide for the tile server, SVS headers, and thumbnail packs.
# It stays optional so API and Databricks App startup do not download it.
# `dev` also installs OpenSlide, Pillow, and tifffile so CI can build a
# pyramidal TIFF and check thumbnail packs. `h5py` is in both `dev` and
# `pipeline`: CI validates TRIDENT H5 files, and `uv sync --group pipeline`
# on the GPU box can validate them too.

[dependency-groups]
dev = [
    "h5py>=3.11",
    "httpx>=0.27",
    "openslide-bin>=4.0",
    "openslide-python>=1.4",
    "pillow>=13.0.0",
    "pytest>=8",
    "ruff>=0.8",
    "tifffile>=2026.3.3",
]
pipeline = [
    "h5py>=3.11",
    "huggingface-hub>=0.26",
    "timm>=1.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
]
tiles = [
    "openslide-bin>=4.0",
    "openslide-python>=1.4",
    "pillow>=13.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live Hugging Face encoders; skipped unless CONSILIUM_RUN_HF_INTEGRATION=1", # pragma: allowlist secret
]
