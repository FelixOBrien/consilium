name: TypeScript

on:
  pull_request:
    paths:
      - "typescript/**"
      - "README.md"
      - ".github/workflows/typescript.yml"
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "README.md"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: bun install --frozen-lockfile
      - name: Generated API client is fresh
        run: bun run gen:api && git diff --exit-code
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run --filter web check
      - run: bun run test
